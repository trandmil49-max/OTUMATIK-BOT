# AGGRESSIVE profile (SRS Part 19): "Lower Confidence, Higher Frequency,
# Higher Risk — still respect all risk management rules." Note that
# dynamic_sl_enabled / dynamic_tp_enabled are NOT overridden here: SRS
# Rule 5 forbids fixed TP/SL under any profile, and schema.py enforces
# that as a hard validation rule regardless of what any profile sets.

metadata:
  strategy_profile: "aggressive"

confidence:
  minimum_confidence: 75.0
  strong_grade: 75.0

risk:
  min_risk_reward: 2.0
  max_active_trades: 8
  max_long_trades: 8
  max_short_trades: 8
  max_same_sector_exposure: 3
  atr_stop_loss_multiplier: 1.3

bitcoin:
  health_threshold: 50.0

market_health:
  health_threshold: 45.0
