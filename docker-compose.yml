# Sadece yerel geliştirme/test için. Railway bunu kullanmaz -- Dockerfile'ı
# doğrudan build eder. Kullanım: `.env` dosyanızı hazırlayıp `docker compose up`.

services:
  bot:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
